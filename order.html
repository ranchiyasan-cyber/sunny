<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | sunny natural</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">sunny</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a class="nav__keep" href="index.html">หน้าแรก</a>
        <a class="nav__keep" href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>

    <section class="page-head text-center">
      <div class="container">
        <h1>สั่งซื้อสินค้า</h1>
        <span class="rule" aria-hidden="true"></span>
        <p class="lead">กรอกข้อมูลด้านล่าง แล้วกดยืนยันการสั่งซื้อ</p>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container">
        <form id="orderForm" class="form-card">

          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" autocomplete="tel" required>
          </div>

          <div class="field">
            <label for="items">รายการสินค้า</label>
            <textarea id="items" name="items" rows="2" required></textarea>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="number" id="total" name="total" min="0" inputmode="numeric" required>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ (ไม่บังคับ)</label>
            <textarea id="note" name="note" rows="3"></textarea>
          </div>

          <button type="submit" class="btn btn--solid btn--block">ยืนยันสั่งซื้อ</button>

        </form>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <a class="logo" href="index.html">sunny</a>
      <p>คืนความสมดุลให้เส้นผมและหนังศีรษะอย่างอ่อนโยน ด้วยสารสกัดจากธรรมชาติ</p>
      <div class="site-footer__bottom">&copy; 2026 sunny natural</div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
